<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curriculum Vitae</title>
<style>
:root{--lateral:#1f3a4d;--titulos:#1f3a4d;--fuente:Arial,Helvetica,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:#e9edf0;font-family:var(--fuente);color:#222;line-height:1.5}
#barraApp{display:flex;justify-content:space-between;max-width:820px;margin:6px auto 0;padding:0 4px}
#barraApp a{color:#1f3a4d;font-size:14px;font-weight:bold;text-decoration:none;padding:8px 10px}
#app{max-width:820px;margin:20px auto;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.2);display:flex;flex-wrap:wrap;min-height:300px}
#barraApp:not([hidden]) + #app{margin-top:4px}
#cargando{text-align:center;padding:60px 20px;color:#5a6b78;width:100%}
.side{width:280px;background:var(--lateral);color:#fff;padding:30px 24px}
.main{flex:1;min-width:280px;padding:30px}
.foto{width:170px;height:170px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 22px;border:4px solid #fff}
.side h2{font-size:13px;letter-spacing:2px;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,.45);padding-bottom:5px;margin:22px 0 10px}
.side p{margin:0 0 8px;font-size:14px;word-wrap:break-word}
.side b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;opacity:.75;font-weight:normal}
h1{margin:0;font-size:30px;color:var(--titulos);line-height:1.15}
.sub{color:#5a6b78;margin:6px 0 20px;font-size:15px}
.main h2{font-size:15px;letter-spacing:2px;text-transform:uppercase;color:var(--titulos);border-bottom:2px solid var(--titulos);padding-bottom:4px;margin:24px 0 10px}
ul{margin:0;padding-left:20px}
li{margin-bottom:6px;font-size:14.5px}
.main p{font-size:14.5px;margin:0 0 8px}
.nota{font-style:italic;margin-top:8px}
.wa{display:block;background:#25d366;color:#fff;text-align:center;text-decoration:none;font-weight:bold;padding:11px 8px;border-radius:6px;font-size:14px;margin-top:6px}
.btnpdf{display:block;width:100%;background:transparent;color:#fff;text-align:center;font-weight:bold;padding:10px 8px;border:2px solid rgba(255,255,255,.8);border-radius:6px;font-size:14px;margin-top:10px;cursor:pointer;font-family:inherit}
.btnpdf:disabled{opacity:.6;cursor:default}
@media(max-width:640px){.side{width:100%}}
@media print{
  body{background:#fff}
  #app{box-shadow:none;margin:0;max-width:none}
  .wa,.btnpdf,#barraApp{display:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@page{size:A4;margin:0}
</style>
</head>
<body>
<div id="barraApp" hidden><a href="app.html">← Inicio</a><a href="admin.html">Editar</a></div>
<div id="app"><div id="cargando">Cargando…</div></div>
<noscript><p style="text-align:center">Para ver este CV necesitás activar JavaScript.</p></noscript>

<script src="cv-datos.js"></script>
<script src="bot.js" defer></script>
<script type="module">
function nodo(tag, clase, texto) {
  var e = document.createElement(tag);
  if (clase) e.className = clase;
  if (texto !== undefined && texto !== null) e.textContent = texto;
  return e;
}
function lista(x) {
  if (!x) return [];
  var a = Array.isArray(x) ? x : Object.keys(x).map(function (k) { return x[k]; });
  return a.filter(function (v) { return v !== undefined && v !== null && v !== ''; });
}
function seccion(titulo) {
  return nodo('h2', '', titulo);
}
function ul(items) {
  var u = nodo('ul');
  items.forEach(function (t) { u.appendChild(nodo('li', '', t)); });
  return u;
}
function cargarScript(src) {
  return new Promise(function (ok, mal) {
    var s = document.createElement('script');
    s.src = src;
    s.onload = ok;
    s.onerror = function () { mal(new Error('No se pudo cargar ' + src)); };
    document.head.appendChild(s);
  });
}

async function descargarPDF(ev) {
  var b = ev.currentTarget;
  var textoOriginal = b.textContent;
  b.disabled = true;
  b.textContent = 'Generando PDF…';
  try {
    if (!window.jspdf) await cargarScript('jspdf.umd.min.js');
    if (!window.generarPDF) await cargarScript('cv-pdf.js');
    await window.generarPDF(window.__cvActual);
  } catch (e) {
    alert('No se pudo generar el PDF. Revisá tu conexión e intentá de nuevo.');
  }
  b.disabled = false;
  b.textContent = textoOriginal;
}

function render(d) {
  d = d || {};
  window.__cvActual = d;
  var t = d.tema || {};
  var st = document.documentElement.style;
  st.setProperty('--lateral', t.colorLateral || '#1f3a4d');
  st.setProperty('--titulos', t.colorTitulos || '#1f3a4d');
  st.setProperty('--fuente', (t.fuente ? '"' + t.fuente + '", ' : '') + 'Arial, Helvetica, sans-serif');
  document.title = 'CV - ' + (d.nombre || '');

  var app = document.getElementById('app');
  app.textContent = '';
  var side = nodo('div', 'side');
  var main = nodo('div', 'main');

  // ---- Columna lateral ----
  if (d.foto) {
    var im = nodo('img', 'foto');
    im.src = d.foto;
    im.alt = 'Foto de ' + (d.nombre || '');
    side.appendChild(im);
  }

  var numero = String(d.whatsapp || '').replace(/\D/g, '');
  if (d.ciudad || numero) {
    side.appendChild(seccion('Contacto'));
    if (d.ciudad) {
      var pc = nodo('p');
      pc.appendChild(nodo('b', '', 'Ciudad'));
      pc.appendChild(document.createTextNode(d.ciudad));
      side.appendChild(pc);
    }
    if (numero) {
      var a = nodo('a', 'wa', d.textoBoton || 'Escribirme por WhatsApp');
      a.href = 'https://wa.me/' + numero + '?text=' + encodeURIComponent(d.mensajeWa || '');
      side.appendChild(a);
    }
  }
  var bp = nodo('button', 'btnpdf', 'Descargar PDF');
  bp.type = 'button';
  bp.onclick = descargarPDF;
  side.appendChild(bp);

  if (d.edad) {
    side.appendChild(seccion('Datos personales'));
    var pe = nodo('p');
    pe.appendChild(nodo('b', '', 'Edad'));
    pe.appendChild(document.createTextNode(d.edad));
    side.appendChild(pe);
  }
  var docs = lista(d.documentacion);
  if (docs.length) {
    side.appendChild(seccion('Documentación'));
    docs.forEach(function (x) { side.appendChild(nodo('p', '', x)); });
  }

  // ---- Columna principal ----
  main.appendChild(nodo('h1', '', d.nombre || ''));
  if (d.subtitulo) main.appendChild(nodo('div', 'sub', d.subtitulo));

  if (d.perfil) {
    main.appendChild(seccion('Perfil'));
    main.appendChild(nodo('p', '', d.perfil));
  }

  var exps = lista(d.experiencia);
  var tareas = lista(d.tareas);
  if (exps.length || tareas.length || d.resumenExp || d.notaBps) {
    main.appendChild(seccion('Experiencia laboral'));
    exps.forEach(function (e) {
      var p = nodo('p');
      p.appendChild(nodo('b', '', e.empresa || ''));
      if (e.periodo) p.appendChild(document.createTextNode(' · ' + e.periodo));
      if (e.detalle) {
        p.appendChild(document.createElement('br'));
        p.appendChild(document.createTextNode(e.detalle));
      }
      main.appendChild(p);
    });
    if (tareas.length) {
      var pt = nodo('p');
      pt.appendChild(nodo('b', '', 'Tareas desempeñadas:'));
      main.appendChild(pt);
      main.appendChild(ul(tareas));
    }
    if (d.resumenExp) {
      var pr = nodo('p', '', d.resumenExp);
      pr.style.marginTop = '8px';
      main.appendChild(pr);
    }
    if (d.notaBps) main.appendChild(nodo('p', 'nota', d.notaBps));
  }

  var form = lista(d.formacion);
  if (form.length) {
    main.appendChild(seccion('Formación'));
    main.appendChild(ul(form));
  }
  var habs = lista(d.habilidades);
  if (habs.length) {
    main.appendChild(seccion('Habilidades'));
    main.appendChild(ul(habs));
  }
  if (d.disponibilidad) {
    main.appendChild(seccion('Disponibilidad'));
    main.appendChild(nodo('p', '', d.disponibilidad));
  }

  app.appendChild(side);
  app.appendChild(main);

  if (location.search.indexOf('imprimir') !== -1 && !render.yaImprimio) {
    render.yaImprimio = true;
    setTimeout(function () { window.print(); }, 400);
  }
}

// ---- Datos: Firebase, con copia guardada en el dispositivo por si no hay conexión ----
var CLAVE_CACHE = 'cv-cache';
function leerCache() {
  try {
    var s = localStorage.getItem(CLAVE_CACHE);
    var o = s ? JSON.parse(s) : null;
    return (o && o._v) ? o : null;
  } catch (e) { return null; }
}
function guardarCache(o) {
  try { localStorage.setItem(CLAVE_CACHE, JSON.stringify(o)); } catch (e) {}
}

// Devuelve los datos, null si no hay nada guardado, o undefined si no pudo conectar.
async function traerDatos() {
  try {
    var A = await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js');
    var D = await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js');
    var db = D.getDatabase(A.initializeApp(window.CV_FIREBASE));
    var s = await D.get(D.ref(db, 'cv'));
    return s.exists() ? s.val() : null;
  } catch (e) {
    return undefined;
  }
}

async function main() {
  if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) {
    document.getElementById('barraApp').hidden = false;
  }
  var carga = traerDatos();
  var espera = new Promise(function (r) { setTimeout(function () { r('tarde'); }, 4000); });
  var res = await Promise.race([carga, espera]);

  if (res === 'tarde') {
    render(leerCache() || window.CV_DEFAULT);
    res = await carga;
    if (res && res._v) { guardarCache(res); render(res); }
    return;
  }
  if (res && res._v) {
    guardarCache(res);
    render(res);
  } else if (res === undefined) {
    render(leerCache() || window.CV_DEFAULT);
  } else {
    render(window.CV_DEFAULT);
  }
}
main();
</script>
</body>
</html>
